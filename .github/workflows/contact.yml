name: Contact Form Handler

# Recebe envios do formulário do portfólio via repository_dispatch
# e registra cada contato como uma Issue neste repositório.

on:
  repository_dispatch:
    types: [contact-form]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar contato como Issue
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload || {}
            const name = String(p.name || 'Não informado').slice(0, 120)
            const email = String(p.email || 'Não informado').slice(0, 200)
            const message = String(p.message || '(sem mensagem)').slice(0, 4000)
            const sentAt = String(p.sent_at || new Date().toISOString()).slice(0, 40)

            const body = [
              '## 📬 Novo contato pelo portfólio',
              '',
              `**Nome:** ${name}`,
              `**E-mail:** ${email}`,
              `**Recebido em:** ${sentAt}`,
              '',
              '### Mensagem',
              '',
              message,
              '',
              '---',
              '_Enviado automaticamente via GitHub Actions (repository_dispatch)._'
            ].join('\n')

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Contato] ${name} — ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
              body: body,
              labels: ['contato']
            })
