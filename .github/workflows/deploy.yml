name: Deploy to GitHub Pages

# Pipeline completo: build + typecheck + lint + testes + auditoria + deploy.
# Deploy no GitHub Pages apenas após todos os passos passarem.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  REPO_NAME: portfolio-savitargood

jobs:
  build:
    name: Build · TypeCheck · Lint · Test · Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Security audit (dependencies de produção)
        run: npm audit --audit-level=critical --omit=dev
        continue-on-error: true

      - name: Build production bundle (base /portfolio-savitargood/)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Verificar saída do build
        run: test -f dist/index.html && echo "dist/index.html OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
